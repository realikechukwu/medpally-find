name: Add to MedPally Find
description: Share a resource with the curator intake workflow.
title: 'intake: '
labels: [intake]
body:
  - type: input
    id: url
    attributes:
      label: Resource URL
      description: Paste a resource or a post containing a link.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Optional context or a personal note.
